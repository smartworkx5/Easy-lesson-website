<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="310" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">A Week of Small Kind Acts</text><line x1="80" y1="190" x2="920" y2="190" stroke="#2563eb" stroke-width="4"/><circle cx="80.0" cy="190" r="14" fill="#2563eb"/><text x="80.0" y="136" font-size="19" fill="#334155" text-anchor="middle">Day 1: Notice</text><text x="80.0" y="160" font-size="19" fill="#334155" text-anchor="middle">kindness around</text><circle cx="248.0" cy="190" r="14" fill="#7c3aed"/><text x="248.0" y="230" font-size="19" fill="#334155" text-anchor="middle">Day 2: Greet three</text><text x="248.0" y="254" font-size="19" fill="#334155" text-anchor="middle">people by name</text><circle cx="416.0" cy="190" r="14" fill="#0891b2"/><text x="416.0" y="136" font-size="19" fill="#334155" text-anchor="middle">Day 3: Thank</text><text x="416.0" y="160" font-size="19" fill="#334155" text-anchor="middle">someone</text><circle cx="584.0" cy="190" r="14" fill="#059669"/><text x="584.0" y="230" font-size="19" fill="#334155" text-anchor="middle">Day 4: Offer help</text><text x="584.0" y="254" font-size="19" fill="#334155" text-anchor="middle">without being</text><circle cx="752.0" cy="190" r="14" fill="#d97706"/><text x="752.0" y="136" font-size="19" fill="#334155" text-anchor="middle">Day 5: Include</text><text x="752.0" y="160" font-size="19" fill="#334155" text-anchor="middle">someone who seems</text><circle cx="920.0" cy="190" r="14" fill="#dc2626"/><text x="920.0" y="230" font-size="19" fill="#334155" text-anchor="middle">Days 6-7:</text><text x="920.0" y="254" font-size="19" fill="#334155" text-anchor="middle">Encourage someone,</text></svg>