<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="330" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Unsafe Reaction vs Safe Response Online</text><rect x="40" y="70" width="460" height="52" rx="10" fill="#2563eb"/><text x="270" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Unsafe reaction</text><circle cx="56" cy="146" r="6" fill="#2563eb"/><text x="74" y="152" font-size="20" fill="#334155">Reply angrily to a cruel message</text><circle cx="56" cy="186" r="6" fill="#2563eb"/><text x="74" y="192" font-size="20" fill="#334155">Click a suspicious link in a hurry</text><circle cx="56" cy="226" r="6" fill="#2563eb"/><text x="74" y="232" font-size="20" fill="#334155">Share personal photos or location</text><circle cx="56" cy="266" r="6" fill="#2563eb"/><text x="74" y="272" font-size="20" fill="#334155">Stay silent about bullying</text><rect x="530" y="70" width="460" height="52" rx="10" fill="#7c3aed"/><text x="760" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Safe response</text><circle cx="546" cy="146" r="6" fill="#7c3aed"/><text x="564" y="152" font-size="20" fill="#334155">Stop, screenshot, block, tell an</text><circle cx="546" cy="186" r="6" fill="#7c3aed"/><text x="564" y="192" font-size="20" fill="#334155">Check with an adult before clicking</text><circle cx="546" cy="226" r="6" fill="#7c3aed"/><text x="564" y="232" font-size="20" fill="#334155">Review privacy settings regularly</text><circle cx="546" cy="266" r="6" fill="#7c3aed"/><text x="564" y="272" font-size="20" fill="#334155">Use the anonymous reporting tool</text></svg>