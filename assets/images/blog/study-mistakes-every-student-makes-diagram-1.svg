<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="410" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Mistakes vs Fixes</text><rect x="40" y="70" width="460" height="52" rx="10" fill="#2563eb"/><text x="270" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Common mistake</text><circle cx="56" cy="146" r="6" fill="#2563eb"/><text x="74" y="152" font-size="20" fill="#334155">Re-reading</text><circle cx="56" cy="186" r="6" fill="#2563eb"/><text x="74" y="192" font-size="20" fill="#334155">Highlighting everything</text><circle cx="56" cy="226" r="6" fill="#2563eb"/><text x="74" y="232" font-size="20" fill="#334155">Cramming</text><circle cx="56" cy="266" r="6" fill="#2563eb"/><text x="74" y="272" font-size="20" fill="#334155">One-subject marathon</text><circle cx="56" cy="306" r="6" fill="#2563eb"/><text x="74" y="312" font-size="20" fill="#334155">Copying notes</text><circle cx="56" cy="346" r="6" fill="#2563eb"/><text x="74" y="352" font-size="20" fill="#334155">Ignoring errors</text><rect x="530" y="70" width="460" height="52" rx="10" fill="#7c3aed"/><text x="760" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Better fix</text><circle cx="546" cy="146" r="6" fill="#7c3aed"/><text x="564" y="152" font-size="20" fill="#334155">Self-test</text><circle cx="546" cy="186" r="6" fill="#7c3aed"/><text x="564" y="192" font-size="20" fill="#334155">Mark key ideas only</text><circle cx="546" cy="226" r="6" fill="#7c3aed"/><text x="564" y="232" font-size="20" fill="#334155">Spaced sessions</text><circle cx="546" cy="266" r="6" fill="#7c3aed"/><text x="564" y="272" font-size="20" fill="#334155">Mix topics</text><circle cx="546" cy="306" r="6" fill="#7c3aed"/><text x="564" y="312" font-size="20" fill="#334155">Write from memory</text><circle cx="546" cy="346" r="6" fill="#7c3aed"/><text x="564" y="352" font-size="20" fill="#334155">Keep an error log</text></svg>