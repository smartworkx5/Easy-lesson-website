<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="490" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">The Discussion Triangle</text><circle cx="500" cy="280" r="86" fill="#2563eb"/><text x="500" y="272" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea</text><line x1="500" y1="280" x2="170" y2="160" stroke="#2563eb" stroke-width="2.5"/><rect x="40" y="130" width="260" height="60" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="158" font-size="19" fill="#1e293b" text-anchor="middle">Listen: capture the</text><text x="170" y="178" font-size="19" fill="#1e293b" text-anchor="middle">question and earlier</text><line x1="500" y1="280" x2="500" y2="130" stroke="#7c3aed" stroke-width="2.5"/><rect x="370" y="100" width="260" height="60" rx="12" fill="#eff6ff" stroke="#7c3aed" stroke-width="2"/><text x="500" y="128" font-size="19" fill="#1e293b" text-anchor="middle">Build: respond to and</text><text x="500" y="148" font-size="19" fill="#1e293b" text-anchor="middle">extend others&#x27; ideas</text><line x1="500" y1="280" x2="830" y2="160" stroke="#0891b2" stroke-width="2.5"/><rect x="700" y="130" width="260" height="60" rx="12" fill="#eff6ff" stroke="#0891b2" stroke-width="2"/><text x="830" y="158" font-size="19" fill="#1e293b" text-anchor="middle">Evidence: support claims</text><text x="830" y="178" font-size="19" fill="#1e293b" text-anchor="middle">with a reason</text><line x1="500" y1="280" x2="170" y2="400" stroke="#059669" stroke-width="2.5"/><rect x="40" y="370" width="260" height="60" rx="12" fill="#eff6ff" stroke="#059669" stroke-width="2"/><text x="170" y="398" font-size="19" fill="#1e293b" text-anchor="middle">Respect: disagree with</text><text x="170" y="418" font-size="19" fill="#1e293b" text-anchor="middle">ideas, not people</text></svg>