<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="290" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Careless Errors vs Concept Gaps</text><rect x="40" y="70" width="460" height="52" rx="10" fill="#2563eb"/><text x="270" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Careless errors</text><circle cx="56" cy="146" r="6" fill="#2563eb"/><text x="74" y="152" font-size="20" fill="#334155">You know the method but slip</text><circle cx="56" cy="186" r="6" fill="#2563eb"/><text x="74" y="192" font-size="20" fill="#334155">Fix with slower checking</text><circle cx="56" cy="226" r="6" fill="#2563eb"/><text x="74" y="232" font-size="20" fill="#334155">Examples: copying, skipping,</text><rect x="530" y="70" width="460" height="52" rx="10" fill="#7c3aed"/><text x="760" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Concept gaps</text><circle cx="546" cy="146" r="6" fill="#7c3aed"/><text x="564" y="152" font-size="20" fill="#334155">The method is not yet clear</text><circle cx="546" cy="186" r="6" fill="#7c3aed"/><text x="564" y="192" font-size="20" fill="#334155">Fix by re-studying the lesson</text><circle cx="546" cy="226" r="6" fill="#7c3aed"/><text x="564" y="232" font-size="20" fill="#334155">Examples: wrong method, confused</text></svg>