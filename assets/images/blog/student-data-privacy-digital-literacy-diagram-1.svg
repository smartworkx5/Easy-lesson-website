<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="570" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Student Data and Privacy Habits</text><rect x="180" y="80" width="640" height="64" rx="14" fill="#2563eb"/><text x="500" y="110" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">What you share: accounts, uploads,</text><text x="500" y="132" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">prompts, location</text><line x1="500" y1="144" x2="500" y2="176" stroke="#64748b" stroke-width="3"/><polygon points="500,176 490,162 510,162" fill="#64748b"/><rect x="180" y="176" width="640" height="64" rx="14" fill="#7c3aed"/><text x="500" y="206" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">The risk: stored data, breaches, loss of</text><text x="500" y="228" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">control</text><line x1="500" y1="240" x2="500" y2="272" stroke="#64748b" stroke-width="3"/><polygon points="500,272 490,258 510,258" fill="#64748b"/><rect x="180" y="272" width="640" height="64" rx="14" fill="#0891b2"/><text x="500" y="302" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Habit 1: deny unnecessary permissions</text><line x1="500" y1="336" x2="500" y2="368" stroke="#64748b" stroke-width="3"/><polygon points="500,368 490,354 510,354" fill="#64748b"/><rect x="180" y="368" width="640" height="64" rx="14" fill="#059669"/><text x="500" y="398" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Habit 2: keep personal details out of AI</text><text x="500" y="420" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">prompts</text><line x1="500" y1="432" x2="500" y2="464" stroke="#64748b" stroke-width="3"/><polygon points="500,464 490,450 510,450" fill="#64748b"/><rect x="180" y="464" width="640" height="64" rx="14" fill="#d97706"/><text x="500" y="494" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Habit 3: guard API keys and use vetted</text><text x="500" y="516" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">tools</text></svg>