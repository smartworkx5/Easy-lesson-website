<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="290" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Self View Versus Peer View</text><rect x="40" y="70" width="460" height="52" rx="10" fill="#2563eb"/><text x="270" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">What students say about themselves</text><circle cx="56" cy="146" r="6" fill="#2563eb"/><text x="74" y="152" font-size="20" fill="#334155">Mostly use AI to learn and</text><circle cx="56" cy="186" r="6" fill="#2563eb"/><text x="74" y="192" font-size="20" fill="#334155">Ask AI to explain difficult concepts</text><circle cx="56" cy="226" r="6" fill="#2563eb"/><text x="74" y="232" font-size="20" fill="#334155">Worry about losing writing skills</text><rect x="530" y="70" width="460" height="52" rx="10" fill="#7c3aed"/><text x="760" y="104" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">What students imagine about peers</text><circle cx="546" cy="146" r="6" fill="#7c3aed"/><text x="564" y="152" font-size="20" fill="#334155">Far more shortcut use than reported</text><circle cx="546" cy="186" r="6" fill="#7c3aed"/><text x="564" y="192" font-size="20" fill="#334155">Quick finishes mistaken for copied</text><circle cx="546" cy="226" r="6" fill="#7c3aed"/><text x="564" y="232" font-size="20" fill="#334155">A norm that may not really exist</text></svg>