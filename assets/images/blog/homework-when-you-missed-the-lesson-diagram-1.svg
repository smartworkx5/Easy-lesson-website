<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="666" viewBox="0 0 1000 666" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="666" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Catch Up After a Missed Lesson</text><rect x="180" y="80" width="640" height="64" rx="14" fill="#2563eb"/><text x="500" y="110" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Find the lesson and read the introduction</text><line x1="500" y1="144" x2="500" y2="176" stroke="#64748b" stroke-width="3"/><polygon points="500,176 490,162 510,162" fill="#64748b"/><rect x="180" y="176" width="640" height="64" rx="14" fill="#7c3aed"/><text x="500" y="206" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Study the worked examples actively</text><line x1="500" y1="240" x2="500" y2="272" stroke="#64748b" stroke-width="3"/><polygon points="500,272 490,258 510,258" fill="#64748b"/><rect x="180" y="272" width="640" height="64" rx="14" fill="#0891b2"/><text x="500" y="302" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Write the method as a short step list</text><line x1="500" y1="336" x2="500" y2="368" stroke="#64748b" stroke-width="3"/><polygon points="500,368 490,354 510,354" fill="#64748b"/><rect x="180" y="368" width="640" height="64" rx="14" fill="#059669"/><text x="500" y="398" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Practise two easy questions</text><line x1="500" y1="432" x2="500" y2="464" stroke="#64748b" stroke-width="3"/><polygon points="500,464 490,450 510,450" fill="#64748b"/><rect x="180" y="464" width="640" height="64" rx="14" fill="#d97706"/><text x="500" y="494" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Solve homework one step at a time</text><line x1="500" y1="528" x2="500" y2="560" stroke="#64748b" stroke-width="3"/><polygon points="500,560 490,546 510,546" fill="#64748b"/><rect x="180" y="560" width="