<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="474" viewBox="0 0 1000 474" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="474" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Post-Exam Review and Move-On Cycle</text><rect x="180" y="80" width="640" height="64" rx="14" fill="#2563eb"/><text x="500" y="110" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Take a short break and avoid answer</text><text x="500" y="132" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">comparisons</text><line x1="500" y1="144" x2="500" y2="176" stroke="#64748b" stroke-width="3"/><polygon points="500,176 490,162 510,162" fill="#64748b"/><rect x="180" y="176" width="640" height="64" rx="14" fill="#7c3aed"/><text x="500" y="206" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Reflect for 20-30 minutes: what went well,</text><text x="500" y="228" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">what was hard</text><line x1="500" y1="240" x2="500" y2="272" stroke="#64748b" stroke-width="3"/><polygon points="500,272 490,258 510,258" fill="#64748b"/><rect x="180" y="272" width="640" height="64" rx="14" fill="#0891b2"/><text x="500" y="302" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Turn lessons into one or two concrete</text><text x="500" y="324" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">actions</text><line x1="500" y1="336" x2="500" y2="368" stroke="#64748b" stroke-width="3"/><polygon points="500,368 490,354 510,354" fill="#64748b"/><rect x="180" y="368" width="640" height="64" rx="14" fill="#059669"/><text x="500" y="398" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Rest, reset, and prepare calmly for what</text><text x="500" y="420" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">comes next</text></svg>