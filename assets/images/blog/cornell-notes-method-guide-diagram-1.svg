<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="282" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">Cornell Notes page layout</text><rect x="60" y="80" width="300" height="184" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="176" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Diagram</text><line x1="360" y1="108" x2="420" y2="108" stroke="#2563eb" stroke-width="2.5"/><circle cx="400" cy="108" r="15" fill="#2563eb"/><text x="400" y="115" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="440" y="104" font-size="20" fill="#334155">Cue column on the left for</text><text x="440" y="126" font-size="20" fill="#334155">questions and keywords</text><line x1="360" y1="172" x2="420" y2="172" stroke="#7c3aed" stroke-width="2.5"/><circle cx="400" cy="172" r="15" fill="#7c3aed"/><text x="400" y="179" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="440" y="168" font-size="20" fill="#334155">Notes area on the right for key</text><text x="440" y="190" font-size="20" fill="#334155">ideas</text><line x1="360" y1="236" x2="420" y2="236" stroke="#0891b2" stroke-width="2.5"/><circle cx="400" cy="236" r="15" fill="#0891b2"/><text x="400" y="243" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="440" y="232" font-size="20" fill="#334155">Summary section at the bottom in</text><text x="440" y="254" font-size="20" fill="#334155">your own words</text></svg>