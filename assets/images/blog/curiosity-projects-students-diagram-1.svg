<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="310" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">One Week, One Question</text><line x1="80" y1="190" x2="920" y2="190" stroke="#2563eb" stroke-width="4"/><circle cx="80.0" cy="190" r="14" fill="#2563eb"/><text x="80.0" y="136" font-size="19" fill="#334155" text-anchor="middle">Day 1: Choose your</text><text x="80.0" y="160" font-size="19" fill="#334155" text-anchor="middle">question</text><circle cx="290.0" cy="190" r="14" fill="#7c3aed"/><text x="290.0" y="230" font-size="19" fill="#334155" text-anchor="middle">Days 2-4: Explore</text><text x="290.0" y="254" font-size="19" fill="#334155" text-anchor="middle">and take notes</text><circle cx="500.0" cy="190" r="14" fill="#0891b2"/><text x="500.0" y="136" font-size="19" fill="#334155" text-anchor="middle">Day 5: Organise</text><text x="500.0" y="160" font-size="19" fill="#334155" text-anchor="middle">your findings</text><circle cx="710.0" cy="190" r="14" fill="#059669"/><text x="710.0" y="230" font-size="19" fill="#334155" text-anchor="middle">Day 6: Build your</text><text x="710.0" y="254" font-size="19" fill="#334155" text-anchor="middle">result</text><circle cx="920.0" cy="190" r="14" fill="#d97706"/><text x="920.0" y="136" font-size="19" fill="#334155" text-anchor="middle">Day 7: Review and</text><text x="920.0" y="160" font-size="19" fill="#334155" text-anchor="middle">share it</text></svg>