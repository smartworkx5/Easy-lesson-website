<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="490" fill="#ffffff"/><text x="40" y="38" font-size="26" font-weight="700" fill="#1e293b">What Makes a Study Partnership Work</text><circle cx="500" cy="280" r="86" fill="#2563eb"/><text x="500" y="272" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Main idea</text><line x1="500" y1="280" x2="170" y2="160" stroke="#2563eb" stroke-width="2.5"/><rect x="40" y="130" width="260" height="60" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170" y="158" font-size="19" fill="#1e293b" text-anchor="middle">Reliability: shows up</text><text x="170" y="178" font-size="19" fill="#1e293b" text-anchor="middle">prepared and on time</text><line x1="500" y1="280" x2="500" y2="130" stroke="#7c3aed" stroke-width="2.5"/><rect x="370" y="100" width="260" height="60" rx="12" fill="#eff6ff" stroke="#7c3aed" stroke-width="2"/><text x="500" y="128" font-size="19" fill="#1e293b" text-anchor="middle">Explaining: teach each</text><text x="500" y="148" font-size="19" fill="#1e293b" text-anchor="middle">other in plain words</text><line x1="500" y1="280" x2="830" y2="160" stroke="#0891b2" stroke-width="2.5"/><rect x="700" y="130" width="260" height="60" rx="12" fill="#eff6ff" stroke="#0891b2" stroke-width="2"/><text x="830" y="158" font-size="19" fill="#1e293b" text-anchor="middle">Quizzing: test recall,</text><text x="830" y="178" font-size="19" fill="#1e293b" text-anchor="middle">not recognition</text><line x1="500" y1="280" x2="170" y2="400" stroke="#059669" stroke-width="2.5"/><rect x="40" y="370" width="260" height="60" rx="12" fill="#eff6ff" stroke="#059669" stroke-width="2"/><text x="170" y="398" font-size="19" fill="#1e293b" text-anchor="middle">Accountability: keep</text><text x="170" y="418" font-size="19" fill="#1e293b" text-anchor="middle">each other on schedule</text><line x1="500" y1="280" x2="500" y2="430" stroke="#d97706" stroke-width="2.5"/><rect x="370" y="400" width="260" height="60" rx="12" fill="#eff6ff" stroke="#d97706" stroke-width="2"/><text x="500" y="428" font-size="19" fill="#1e293b" text-anchor="middle">Rules: structure, focus</text><text x="500" y="448" font-size="19" fill="#1e293b" text-anchor="middle">blocks, phones away</text></svg>